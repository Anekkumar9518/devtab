<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked · focus mode</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="stylesheet" href="css/blocked.css">
</head>
<body data-mode="dev">
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <main class="wall">
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 220 220"><circle class="ring__bg" cx="110" cy="110" r="96"/><circle class="ring__fg" id="ringFg" cx="110" cy="110" r="96"/></svg>
      <span class="ring__lock" id="lock"></span>
    </div>
    <p class="kicker" id="kicker">Focus mode</p>
    <h1 class="title" id="title" data-text="Not now.">Not now.</h1>
    <p class="host" id="host"></p>
    <div class="left"><b id="left">--:--</b><span id="leftLbl">left in this session</span></div>
    <pre class="term" id="term" hidden></pre>
    <p class="line" id="line"></p>
    <div class="acts">
      <button type="button" class="b b--main" id="back">Back to work</button>
      <button type="button" class="b b--hold" id="end"><span class="b__fill"></span><span class="b__t">Hold to end focus</span></button>
    </div>
  </main>
  <script type="module" src="js/blocked.js"></script>
</body>
</html>
