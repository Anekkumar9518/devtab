<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <meta name="description" content="DevTab: a developer and hacker style new tab with animated 4K backgrounds, your own video, command search, shortcuts, to-dos and weather.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="icons/icon48.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/alert.css">
</head>
<body data-mode="dev">
  <div class="bg" aria-hidden="true">
    <canvas id="bgCanvas"></canvas>
    <img id="bgImg" alt="" hidden>
    <video id="bgVideo" muted loop playsinline autoplay hidden></video>
    <div class="bg__dim"></div>
    <div class="bg__fx"></div>
  </div>

  <div class="boot" id="boot" hidden aria-hidden="true"><pre></pre></div>

  <header class="bar">
    <div class="brand"><span class="brand__mark" aria-hidden="true"></span><span class="brand__txt">devtab</span></div>
    <div class="modes" role="radiogroup" aria-label="Look">
      <button type="button" role="radio" data-set-mode="dev">Developer</button>
      <button type="button" role="radio" data-set-mode="hacker">Hacker</button>
    </div>
    <div class="bar__r">
      <div class="weather" id="weather" hidden></div>
      <button type="button" class="icon-btn" id="openSettings" aria-label="Settings" title="Settings"></button>
    </div>
  </header>

  <main class="center">
    <div class="clock" id="clock" aria-live="off"></div>
    <p class="greet" id="greet"></p>
    <form class="search" id="search" role="search">
      <span class="search__prompt" id="prompt" aria-hidden="true"></span>
      <input id="q" type="text" autocomplete="off" spellcheck="false" aria-label="Search or type a URL">
      <kbd class="search__key" title="Press / to search">/</kbd>
    </form>
    <div class="hints" id="hints"></div>
    <nav class="links" id="links" aria-label="Shortcuts"></nav>
  </main>

  <aside class="todo panel" id="todo" aria-label="Tasks and reminders">
    <div class="ptabs" role="tablist">
      <button type="button" role="tab" data-tab="tasks" aria-selected="true"><span id="todoTitle">Tasks</span><small id="todoCount"></small></button>
      <button type="button" role="tab" data-tab="history" aria-selected="false">History<small id="histCount"></small></button>
    </div>
    <div data-pane="tasks">
      <form id="todoForm" class="tform" autocomplete="off">
        <div class="tform__row">
          <input id="todoIn" maxlength="140" placeholder="Add a task and press Enter" aria-label="New task">
          <button type="button" class="tform__clock" id="whenBtn" aria-label="Set a reminder time" aria-expanded="false" title="Remind me at a time"></button>
        </div>
        <div class="tform__when" id="whenBox" hidden>
          <div class="tform__chips">
            <button type="button" data-in="15">+15 min</button><button type="button" data-in="30">+30 min</button><button type="button" data-in="60">+1 hour</button><button type="button" data-in="tomorrow">Tomorrow 9 AM</button>
          </div>
          <label class="tform__dt"><span>Or pick</span><input type="datetime-local" id="whenAt" aria-label="Reminder date and time"></label>
          <p class="tform__sel" id="whenSel"></p>
        </div>
      </form>
      <ul id="todoList" class="tlist"></ul>
    </div>
    <div data-pane="history" hidden>
      <ul id="histList" class="hlist"></ul>
      <div class="pager" id="histPager"></div>
    </div>
  </aside>

  <p class="credit" id="credit"></p>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="settings" hidden aria-label="Settings"></aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
